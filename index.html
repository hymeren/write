<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'; connect-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Focused Writer</title>

<!-- Set the theme before first paint so dark mode never flashes white -->
<script>
(function () {
  try {
    var d = localStorage.getItem('writer-dark-mode');
    if (d === null) d = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'true' : 'false';
    if (d === 'true') document.documentElement.classList.add('dark');
  } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Courier+Prime&family=Crimson+Pro&family=Inter:wght@400;500;600&family=Literata&family=Lora&family=Newsreader&family=Source+Serif+4&display=swap" rel="stylesheet">
<style>
/* Light: pale mist with a quiet green-teal accent. Dark: deep ink with the same hue, softened. */
:root {
  --bg: #e8edea;
  --panel: #f6f8f5;
  --text: #25302c;
  --muted: #808d88;
  --border: #cdd7d1;
  --btn: #e3eae6;
  --btn-hover: #d6e0da;
  --accent: #3d7b6b;
  --select: rgba(61, 123, 107, 0.22);
  --thumb: #bac7c0;
  --font: 'Literata', Georgia, serif;
  --size: 19px;
  --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
html.dark {
  --bg: #0e1215;
  --panel: #151a1e;
  --text: #d5dcd9;
  --muted: #6c7875;
  --border: #252f35;
  --btn: #1e262b;
  --btn-hover: #28333a;
  --accent: #85bfad;
  --select: rgba(133, 191, 173, 0.25);
  --thumb: #34424b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--ui);
  display: flex; flex-direction: column; align-items: center; overflow: hidden;
}

/* ---------- toolbar ---------- */
#dock {
  margin-top: 18px; flex-shrink: 0; width: 92%; max-width: 760px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: space-between; align-items: center;
}
.group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
button, select {
  background: var(--btn); color: var(--text); border: 1px solid transparent; padding: 7px 11px;
  border-radius: 8px; cursor: pointer; font: 500 13.5px var(--ui);
  transition: background .15s ease;
}
button:hover, select:hover { background: var(--btn-hover); }
button:focus-visible, select:focus-visible, #title:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
#download { background: var(--accent); color: var(--panel); font-weight: 600; }
#download:hover { background: var(--accent); filter: brightness(1.08); }

/* ---------- title ---------- */
#titlebar { width: 92%; max-width: 760px; flex-shrink: 0; margin-top: 18px; padding: 0 6px; }
#title {
  display: block; width: 100%; background: transparent; color: var(--text);
  border: 0; border-bottom: 1px solid var(--border); border-radius: 0;
  padding: 6px 0 10px; font-family: var(--font); font-size: 1.6rem; font-weight: 500;
  line-height: 1.3; outline: 0; transition: border-color .15s ease;
}
#title:focus { border-bottom-color: var(--accent); }
#title:focus-visible { outline: 0; }
#title::placeholder { color: var(--muted); opacity: 1; font-weight: 400; }

/* ---------- writing area ---------- */
#wrap {
  width: 92%; max-width: 760px; margin: 14px 0 18px; flex: 1 1 auto; min-height: 0;
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
}
#editor {
  display: block; width: 100%; height: 100%; border: 0; outline: 0; resize: none;
  background: transparent; color: var(--text); caret-color: var(--accent);
  font-family: var(--font); font-size: var(--size);
  line-height: 1.8; letter-spacing: 0.005em;
  padding: 36px 44px 50vh; white-space: pre-wrap; overflow-wrap: break-word;
  tab-size: 4;
  scrollbar-width: thin; scrollbar-color: var(--thumb) transparent;
}
#editor::selection, #title::selection { background: var(--select); }
#editor::placeholder { color: var(--muted); opacity: 1; }
#editor::-webkit-scrollbar { width: 12px; }
#editor::-webkit-scrollbar-track { background: transparent; }
#editor::-webkit-scrollbar-thumb {
  background: var(--thumb); border-radius: 8px; border: 3px solid transparent; background-clip: content-box;
}
#editor::-webkit-scrollbar-thumb:hover { background: var(--muted); background-clip: content-box; border: 3px solid transparent; }

#status {
  position: fixed; bottom: 14px; right: 14px; background: var(--panel); color: var(--muted);
  border: 1px solid var(--border); padding: 5px 13px; border-radius: 20px;
  font: 500 12.5px var(--ui); pointer-events: none;
}
@media (max-width: 520px) {
  #editor { padding: 24px 20px 50vh; }
  #title { font-size: 1.35rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<div id="dock">
  <div class="group">
    <select id="font" title="Font" aria-label="Font">
      <optgroup label="Serif">
        <option value="'Literata', Georgia, serif">Literata</option>
        <option value="'Newsreader', Georgia, serif">Newsreader</option>
        <option value="'Source Serif 4', Georgia, serif">Source Serif</option>
        <option value="'Lora', Georgia, serif">Lora</option>
        <option value="'Crimson Pro', Georgia, serif">Crimson Pro</option>
      </optgroup>
      <optgroup label="Sans">
        <option value="'Atkinson Hyperlegible', system-ui, sans-serif">Atkinson Hyperlegible</option>
        <option value="'Inter', system-ui, sans-serif">Inter</option>
      </optgroup>
      <optgroup label="Mono">
        <option value="'Courier Prime', 'Courier New', monospace">Courier Prime</option>
      </optgroup>
    </select>
    <select id="size" title="Font size" aria-label="Font size">
      <option value="15px">15</option><option value="17px">17</option>
      <option value="19px">19</option><option value="21px">21</option>
      <option value="23px">23</option><option value="26px">26</option>
    </select>
    <button id="spell" aria-pressed="false" title="Spellcheck can slow down very long drafts">Spellcheck</button>
  </div>
  <div class="group">
    <button id="theme" aria-label="Switch theme">Dark</button>
    <button id="download" title="Download as text file (Ctrl/Cmd+S)">Download .txt</button>
  </div>
</div>

<div id="titlebar">
  <input id="title" type="text" maxlength="120" autocomplete="off" spellcheck="false"
    aria-label="Title" placeholder="Draft" title="Used as the file name. Leave it empty to save as Draft plus today's date.">
</div>

<div id="wrap">
  <textarea id="editor" placeholder="Drafting the next chapter about Ryan..." spellcheck="false"
    autocomplete="off" autocapitalize="sentences" aria-label="Writing area"></textarea>
</div>
<div id="status" role="status" aria-live="off">0 words</div>

<script>
(function () {
  'use strict';

  var editor = document.getElementById('editor');
  var titleEl = document.getElementById('title');
  var statusEl = document.getElementById('status');
  var fontSel = document.getElementById('font');
  var sizeSel = document.getElementById('size');
  var spellBtn = document.getElementById('spell');
  var themeBtn = document.getElementById('theme');
  var root = document.documentElement;

  // ---------- small settings (localStorage is fine for tiny values) ----------
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ---------- dates and file names ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStamp() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function defaultName() { return 'Draft ' + todayStamp(); }
  function cleanName(s) {
    return s
      .replace(/[\u0000-\u001f\u007f]/g, '')
      .replace(/[\\\/:*?"<>|]/g, '')
      .replace(/\s+/g, ' ')
      .replace(/^[.\s]+|[.\s]+$/g, '')
      .slice(0, 80);
  }
  function fileName() { return (cleanName(titleEl.value) || defaultName()) + '.txt'; }

  // Placeholder shows exactly what the file will be called if the title stays empty.
  function refreshPlaceholder() { titleEl.placeholder = defaultName(); }
  refreshPlaceholder();

  function refreshDocTitle() {
    var t = cleanName(titleEl.value);
    document.title = t ? t + ' | Focused Writer' : 'Focused Writer';
  }

  // ---------- theme ----------
  function syncThemeButton() {
    var on = root.classList.contains('dark');
    themeBtn.textContent = on ? 'Light' : 'Dark';
    themeBtn.setAttribute('aria-label', on ? 'Switch to light theme' : 'Switch to dark theme');
  }
  syncThemeButton();
  themeBtn.onclick = function () {
    var on = root.classList.toggle('dark');
    lsSet('writer-dark-mode', on);
    syncThemeButton();
  };

  // ---------- font and size ----------
  function applyFont(v) {
    for (var i = 0; i < fontSel.options.length; i++) {
      if (fontSel.options[i].value === v) { fontSel.value = v; root.style.setProperty('--font', v); return true; }
    }
    return false;
  }
  function applySize(v) {
    for (var i = 0; i < sizeSel.options.length; i++) {
      if (sizeSel.options[i].value === v) { sizeSel.value = v; root.style.setProperty('--size', v); return true; }
    }
    return false;
  }
  // Old saved values (fonts that no longer exist) quietly fall back to the defaults.
  if (!applyFont(lsGet('writer-font'))) applyFont(fontSel.options[0].value);
  if (!applySize(lsGet('writer-font-size'))) applySize('19px');
  fontSel.onchange = function () { applyFont(fontSel.value); lsSet('writer-font', fontSel.value); editor.focus(); };
  sizeSel.onchange = function () { applySize(sizeSel.value); lsSet('writer-font-size', sizeSel.value); editor.focus(); };

  function setSpell(on) {
    editor.spellcheck = on;
    titleEl.spellcheck = on;
    spellBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    lsSet('writer-spellcheck', on);
  }
  setSpell(lsGet('writer-spellcheck') === 'true');
  spellBtn.onclick = function () { setSpell(editor.spellcheck !== true); editor.focus(); };

  // ---------- storage: IndexedDB (async, large quota) with localStorage backup ----------
  var DB_NAME = 'focused-writer', STORE = 'kv', KEY = 'draft';
  var dbPromise = new Promise(function (resolve) {
    try {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(STORE); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { resolve(null); };
      req.onblocked = function () { resolve(null); };
    } catch (e) { resolve(null); }
  });

  function idbGet() {
    return dbPromise.then(function (db) {
      if (!db) return null;
      return new Promise(function (resolve) {
        try {
          var r = db.transaction(STORE, 'readonly').objectStore(STORE).get(KEY);
          r.onsuccess = function () { resolve(r.result || null); };
          r.onerror = function () { resolve(null); };
        } catch (e) { resolve(null); }
      });
    });
  }
  function idbSet(obj) {
    return dbPromise.then(function (db) {
      if (!db) return false;
      return new Promise(function (resolve) {
        try {
          var tx = db.transaction(STORE, 'readwrite');
          tx.objectStore(STORE).put(obj, KEY);
          tx.oncomplete = function () { resolve(true); };
          tx.onerror = tx.onabort = function () { resolve(false); };
        } catch (e) { resolve(false); }
      });
    });
  }

  // Oldest version stored HTML in localStorage. Convert it to plain text once, without running any of it.
  function legacyToText(html) {
    var s = html
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/(div|p|h[1-6]|li)>/gi, '\n')
      .replace(/<(div|p|h[1-6]|li)[^>]*>/gi, '');
    var doc = new DOMParser().parseFromString(s, 'text/html');
    return (doc.body.textContent || '').replace(/\u00a0/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  }

  // Returns { text, title }. Drafts saved before titles existed just come back with an empty title.
  function loadDraft() {
    return idbGet().then(function (rec) {
      var backup = null;
      try { backup = JSON.parse(lsGet('writer-text-backup')); } catch (e) {}
      var best = rec;
      if (backup && typeof backup.text === 'string' && (!best || backup.t > best.t)) best = backup;
      if (best && typeof best.text === 'string') {
        return { text: best.text, title: typeof best.title === 'string' ? best.title : '' };
      }
      var legacy = lsGet('writer-content');
      if (legacy) return { text: legacyToText(legacy), title: '' };
      return { text: '', title: '' };
    });
  }

  // ---------- saving: debounced, never on every keystroke ----------
  var dirty = false, saveTimer = 0, firstDirtyAt = 0, loaded = false;
  var SAVE_IDLE = 600, SAVE_MAX = 5000;

  function snapshot() { return { text: editor.value, title: titleEl.value, t: Date.now() }; }

  function flushNow() {
    if (!loaded || !dirty) return;
    clearTimeout(saveTimer); saveTimer = 0;
    var snap = snapshot();
    dirty = false; firstDirtyAt = 0;
    // Synchronous backup so closing the tab never loses text.
    try { localStorage.setItem('writer-text-backup', JSON.stringify(snap)); } catch (e) {}
    idbSet(snap).then(function () {
      if (!dirty) setStatusSaved();
    });
  }

  function scheduleSave() {
    dirty = true;
    var now = Date.now();
    if (!firstDirtyAt) firstDirtyAt = now;
    clearTimeout(saveTimer);
    var wait = Math.min(SAVE_IDLE, Math.max(0, SAVE_MAX - (now - firstDirtyAt)));
    saveTimer = setTimeout(flushNow, wait);
  }

  // ---------- word count: one pass, no arrays, deferred until idle ----------
  var wordTimer = 0, savedLabel = true, lastWords = 0;
  function countWords(s) {
    var n = 0, inWord = false;
    for (var i = 0, len = s.length; i < len; i++) {
      var c = s.charCodeAt(i);
      var space = c <= 32 || c === 160 || (c >= 0x2000 && c <= 0x200a) || c === 0x2028 || c === 0x2029 || c === 0x3000;
      if (space) inWord = false;
      else if (!inWord) { inWord = true; n++; }
    }
    return n;
  }
  function renderStatus() {
    statusEl.textContent = lastWords.toLocaleString() + (lastWords === 1 ? ' word' : ' words') + (savedLabel ? '' : ' (unsaved)');
  }
  function setStatusSaved() { savedLabel = true; renderStatus(); }
  function scheduleCount() {
    clearTimeout(wordTimer);
    wordTimer = setTimeout(function () {
      lastWords = countWords(editor.value);
      renderStatus();
    }, 300);
  }

  editor.addEventListener('input', function () {
    savedLabel = false;
    scheduleSave();
    scheduleCount();
  });
  titleEl.addEventListener('input', function () {
    savedLabel = false;
    refreshDocTitle();
    renderStatus();
    scheduleSave();
  });
  // Enter in the title jumps straight into the draft.
  titleEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); editor.focus(); }
  });

  // Save when leaving. visibilitychange is the reliable one on mobile.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushNow();
    else refreshPlaceholder();
  });
  window.addEventListener('pagehide', flushNow);

  // ---------- download ----------
  function download() {
    var title = titleEl.value.trim();
    var body = title ? title + '\n\n' + editor.value : editor.value;
    var blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = fileName();
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  document.getElementById('download').onclick = download;
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); flushNow(); download(); }
  });

  // ---------- startup ----------
  editor.disabled = true;
  titleEl.disabled = true;
  loadDraft().then(function (draft) {
    var text = draft.text;
    editor.value = text;
    titleEl.value = draft.title;
    editor.disabled = false;
    titleEl.disabled = false;
    loaded = true;
    lastWords = countWords(text);
    savedLabel = true;
    renderStatus();
    refreshDocTitle();
    editor.focus();
    editor.setSelectionRange(text.length, text.length);
    editor.scrollTop = editor.scrollHeight;
    // If we pulled in an old draft, save it in the new format right away.
    if (text && !lsGet('writer-text-backup')) { dirty = true; flushNow(); }
  });

  // Ask the browser not to evict saved drafts under storage pressure.
  if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }
})();
</script>
</body>
</html>
